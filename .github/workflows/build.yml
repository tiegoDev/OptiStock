name: Android CI - Dual Play Store Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Normalize PNG resources & clean duplicate strings for AAPT2 Release
      run: |
        if [ -f "app/src/main/res/values/strings.xml" ]; then
          sed -i '/name="app_name"/d' app/src/main/res/values/strings.xml
        fi
        python3 - << 'PYEOF'
        import os
        try:
            from PIL import Image
            p = "app/src/main/res/drawable/splash_logo.png"
            if os.path.exists(p):
                im = Image.open(p).convert("RGBA")
                im.save(p, "PNG")
                print("splash_logo.png normalized to true RGBA PNG")
        except Exception as e:
            print("PIL skip:", e)
        PYEOF

    - name: Generate and persist fixed Keystore if missing
      run: |
        if [ ! -f "app/optistock.keystore" ]; then
          keytool -genkeypair -v \
            -keystore app/optistock.keystore \
            -alias optistock_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass optistock123 \
            -keypass optistock123 \
            -dname "CN=GoDev, OU=GoDev Labs, O=GoDev, L=Vannes, S=Morbihan, C=FR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/optistock.keystore
          git commit -m "Auto-generate fixed optistock.keystore" || true
          git push origin HEAD:main || true
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Trial Edition (APK & AAB)
      run: gradle assembleTrialRelease bundleTrialRelease --no-daemon --stacktrace

    - name: Build Pro Edition (APK & AAB)
      run: gradle assembleProRelease bundleProRelease --no-daemon --stacktrace

    - name: Prepare Play Store Release Package
      run: |
        mkdir -p playstore_release/AAB_PlayStore
        mkdir -p playstore_release/APK_Install
        mkdir -p playstore_release/Visuels_PlayStore
        cp app/build/outputs/bundle/trialRelease/*.aab playstore_release/AAB_PlayStore/OptiStock-Trial-14Jours-v1.16.aab || true
        cp app/build/outputs/bundle/proRelease/*.aab playstore_release/AAB_PlayStore/OptiStock-PRO-v1.16.aab || true
        cp app/build/outputs/apk/trial/release/*.apk playstore_release/APK_Install/OptiStock-Trial-14Jours-v1.16.apk || true
        cp app/build/outputs/apk/pro/release/*.apk playstore_release/APK_Install/OptiStock-PRO-v1.16.apk || true
        cp playstore_assets.html playstore_release/Visuels_PlayStore/
        cp app/src/main/res/drawable/splash_logo.png playstore_release/Visuels_PlayStore/Logo_Original.png || true

    - name: Upload Complete Play Store Pack
      uses: actions/upload-artifact@v4
      with:
        name: OptiStock-Pack-Complet-PlayStore-v1.16
        path: playstore_release/
