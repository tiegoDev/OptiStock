name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and persist fixed Keystore if missing
      run: |
        if [ ! -f "app/optistock.keystore" ]; then
          keytool -genkeypair -v \
            -keystore app/optistock.keystore \
            -alias optistock_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass optistock123 \
            -keypass optistock123 \
            -dname "CN=GoDev, OU=GoDev Labs, O=GoDev, L=Vannes, S=Morbihan, C=FR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/optistock.keystore
          git commit -m "Auto-generate fixed optistock.keystore" || true
          git push origin HEAD:main || true
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OptiStock-v1.12-Debug
        path: app/build/outputs/apk/debug/*.apk
