plugins {
    id 'com.android.application'
}

def keystoreFile = file("optistock.keystore")
if (!keystoreFile.exists()) {
    def javaHome = System.getProperty("java.home")
    def keytoolBin = new File(javaHome, "bin/keytool").exists() ? new File(javaHome, "bin/keytool").absolutePath : "keytool"
    def proc = [
        keytoolBin, "-genkeypair", "-v",
        "-keystore", keystoreFile.absolutePath,
        "-alias", "optistock_key",
        "-keyalg", "RSA",
        "-keysize", "2048",
        "-validity", "10000",
        "-storepass", "optistock123",
        "-keypass", "optistock123",
        "-dname", "CN=GoDev, OU=GoDev Labs, O=GoDev, L=Vannes, S=Morbihan, C=FR"
    ].execute()
    proc.waitFor()
}

android {
    namespace 'com.godev.optistock'
    compileSdk 34

    defaultConfig {
        applicationId "com.godev.optistock"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "1.12"
    }

    signingConfigs {
        fixedConfig {
            storeFile file("optistock.keystore")
            storePassword "optistock123"
            keyAlias "optistock_key"
            keyPassword "optistock123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixedConfig
        }
        release {
            signingConfig signingConfigs.fixedConfig
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.android.billingclient:billing:6.2.1'
}
