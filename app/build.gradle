plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godev.optistock'
    compileSdk 34

    defaultConfig {
        applicationId "com.godev.optistock"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "1.13"
    }

    signingConfigs {
        fixedConfig {
            storeFile file("optistock.keystore")
            storePassword "optistock123"
            keyAlias "optistock_key"
            keyPassword "optistock123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixedConfig
        }
        release {
            signingConfig signingConfigs.fixedConfig
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.android.billingclient:billing:6.2.1'
}
