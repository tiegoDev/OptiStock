<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiStock - Générateur Visuels Google Play Store (GoDev)</title>
<style>
  body { background: #020617; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; padding: 24px; text-align: center; }
  h1 { color: #38BDF8; margin-bottom: 6px; }
  p { color: #94A3B8; font-size: 14px; margin-top: 0; }
  .card { background: #0F172A; border: 1px solid #1E3A8A; border-radius: 16px; padding: 20px; margin: 20px auto; max-width: 1080px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  canvas { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #38BDF8; margin: 12px 0; }
  .btn { background: linear-gradient(180deg, #10B981, #059669); color: white; border: none; border-bottom: 4px solid #064E3B; padding: 12px 22px; font-size: 15px; font-weight: bold; border-radius: 12px; cursor: pointer; margin: 6px; }
  .btn-blue { background: linear-gradient(180deg, #0EA5E9, #0284C7); border-bottom: 4px solid #075985; }
  .upload-box { margin: 16px auto; padding: 12px; background: #112240; border-radius: 12px; display: inline-block; border: 1px dashed #38BDF8; }
</style>
</head>
<body>

<h1>📦 Kit Visuels Play Store — OptiStock & OptiStock Pro</h1>
<p>Génère automatiquement tes bannières officielles Google Play (1024×500 px) et tes icônes HD (512×512 px)</p>

<div class="upload-box">
  <label style="font-weight:bold;color:#38BDF8;">🖼️ Optionnel : Charger ton fichier logo (1000018415.png) pour l'intégrer aux bannières : </label><br><br>
  <input type="file" id="logoInput" accept="image/*">
</div>

<div class="card">
  <h2>1. Bannière de Présentation Google Play (1024 × 500 px) — Version Essai & Pro</h2>
  <canvas id="bannerCanvas" width="1024" height="500"></canvas><br>
  <button class="btn" onclick="downloadCanvas('bannerCanvas', 'OptiStock_Feature_Graphic_1024x500.png')">⬇️ Télécharger la Bannière 1024×500 (.PNG)</button>
  <button class="btn btn-blue" onclick="toggleProBanner()">🔄 Basculer Bannière Essai / Version Pro</button>
</div>

<div class="card">
  <h2>2. Icône Haute Résolution Google Play (512 × 512 px)</h2>
  <canvas id="iconCanvas" width="512" height="512" style="max-width:256px;"></canvas><br>
  <button class="btn" onclick="downloadCanvas('iconCanvas', 'OptiStock_Icon_512x512.png')">⬇️ Télécharger l'Icône 512×512 (.PNG)</button>
</div>

<script>
let isProMode = false;
let uploadedLogo = null;

document.getElementById('logoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      uploadedLogo = img;
      drawAll();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
});

function toggleProBanner() {
  isProMode = !isProMode;
  drawAll();
}

function drawAll() {
  drawBanner();
  drawIcon();
}

function drawBanner() {
  const c = document.getElementById('bannerCanvas');
  const ctx = c.getContext('2d');

  // Fond Cyber-Logistique
  const grad = ctx.createLinearGradient(0, 0, 1024, 500);
  grad.addColorStop(0, '#020617');
  grad.addColorStop(0.5, '#0B1736');
  grad.addColorStop(1, '#0F172A');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 500);

  // Grille subtile
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 1024; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 500); ctx.stroke(); }
  for (let y = 0; y < 500; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke(); }

  // Halo lumineux
  const rad = ctx.createRadialGradient(230, 250, 20, 230, 250, 240);
  rad.addColorStop(0, 'rgba(14, 165, 233, 0.38)');
  rad.addColorStop(1, 'rgba(2, 6, 23, 0)');
  ctx.fillStyle = rad;
  ctx.fillRect(0, 0, 1024, 500);

  // Logo à gauche
  if (uploadedLogo) {
    ctx.drawImage(uploadedLogo, 60, 80, 340, 340);
  } else {
    ctx.strokeStyle = '#38BDF8';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(230, 250, 145, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#F59E0B';
    ctx.fillRect(170, 190, 120, 110);
    ctx.fillStyle = '#10B981';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText('▲', 120, 280);
    ctx.fillStyle = '#EF4444';
    ctx.fillText('▼', 300, 280);
  }

  // Titre OptiStock
  ctx.font = '900 78px system-ui, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('Opti', 435, 145);
  const optiW = ctx.measureText('Opti').width;
  ctx.fillStyle = '#38BDF8';
  ctx.fillText('Stock', 435 + optiW, 145);

  if (isProMode) {
    ctx.fillStyle = '#10B981';
    ctx.beginPath();
    ctx.roundRect(840, 92, 130, 52, 14);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText('PRO', 876, 128);
  }

  // Sous-titre accrocheur
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillStyle = '#E2E8F0';
  ctx.fillText('GESTION DE STOCK, SCANNER & TICKETS DE CAISSE', 435, 195);

  // Puces arguments
  const perks = [
    '🟢  Multi-Stocks & Catégories illimités (100% Hors-Ligne)',
    '📷  Scan Code-Barres ultra-rapide ou Saisie directe',
    '🧾  Tickets de caisse PDF, Remises & Envoi Mail auto',
    '📊  Import/Export Catalogue CSV, Excel & Rapports PDF'
  ];
  ctx.font = '600 22px system-ui, sans-serif';
  ctx.fillStyle = '#94A3B8';
  perks.forEach((p, idx) => {
    ctx.fillText(p, 435, 255 + idx * 44);
  });

  // Badge bas
  ctx.fillStyle = '#1E293B';
  ctx.strokeStyle = '#38BDF8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(435, 425, 520, 44, 12);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#38BDF8';
  ctx.font = 'bold 19px system-ui, sans-serif';
  const footerText = isProMode
    ? '⭐ VERSION PRO ILLIMITÉE  •  DÉVELOPPÉ PAR GODEV'
    : '🎁 ESSAI GRATUIT 14 JOURS  •  DÉVELOPPÉ PAR GODEV';
  ctx.fillText(footerText, 460, 453);
}

function drawIcon() {
  const c = document.getElementById('iconCanvas');
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, '#040B1C');
  grad.addColorStop(1, '#0F172A');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  if (uploadedLogo) {
    ctx.drawImage(uploadedLogo, 0, 0, 512, 512);
  } else {
    ctx.strokeStyle = '#38BDF8';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(256, 256, 225, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#F59E0B';
    ctx.fillRect(166, 150, 180, 150);

    ctx.font = '900 74px system-ui, sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('Opti', 75, 405);
    ctx.fillStyle = '#38BDF8';
    ctx.fillText('Stock', 230, 405);
  }

  if (isProMode) {
    ctx.fillStyle = '#10B981';
    ctx.beginPath();
    ctx.roundRect(330, 24, 158, 64, 18);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 38px system-ui, sans-serif';
    ctx.fillText('PRO', 368, 69);
  }
}

function downloadCanvas(canvasId, filename) {
  const c = document.getElementById(canvasId);
  const link = document.createElement('a');
  link.download = filename;
  link.href = c.toDataURL('image/png');
  link.click();
}

drawAll();
</script>
</body>
</html>
